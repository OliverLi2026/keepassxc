name: Build Release Windows KeePassXC

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Clone and Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      # 关键步骤：在配置前将 MinGW 从环境变量 PATH 中彻底移除，防止编译器混淆
      - name: Configure CMake (Force MSVC)
        run: |
          set PATH=%PATH:C:\mingw64\bin;=%
          mkdir build
          cd build
          cmake -G "Ninja" -DWITH_XC_ALL=ON -DWITH_XC_NETWORKING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ..
        shell: cmd

      - name: Build with Ninja
        run: |
          set PATH=%PATH:C:\mingw64\bin;=%
          cd build
          ninja
        shell: cmd

      - name: Package
        run: |
          cd build
          cpack -G ZIP
        shell: cmd

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.zip
