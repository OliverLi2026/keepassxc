name: Build Windows KeePassXC

on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 确保把 vcpkg 子模块一起拉取下来

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      # 初始化并引导自带的 vcpkg
      - name: Bootstrap vcpkg
        run: |
          cd vcpkg
          .\bootstrap-vcpkg.bat
        shell: cmd

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DWITH_XC_ALL=ON -DWITH_XC_NETWORKING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" ..

      - name: Build with Ninja
        run: |
          cd build
          ninja

      - name: Package
        run: |
          cd build
          cpack -G ZIP

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-NoNetwork
          path: build/*.zip
