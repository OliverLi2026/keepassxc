name: Build Release Windows KeePassXC

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Clone and Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      # 关键修改：显式让 vcpkg 安装 qtbase 以及 KeePassXC 需要的 Qt 模块
      - name: Install Dependencies via vcpkg
        run: |
          C:\vcpkg\vcpkg install qtbase qtsvg qttools --triplet x64-windows
        shell: cmd

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DWITH_XC_ALL=ON -DWITH_XC_NETWORKING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ..
        shell: cmd

      - name: Build with Ninja
        run: |
          cd build
          ninja
        shell: cmd

      - name: Package
        run: |
          cd build
          cpack -G ZIP
        shell: cmd

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.zip
