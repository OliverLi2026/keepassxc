name: Build Release Windows KeePassXC

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Clone and Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      # 配置 CMake，显式指定使用 Visual Studio (MSVC) 和 Ninja，并关闭网络模块
      - name: Configure CMake (MSVC)
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DWITH_XC_ALL=ON -DWITH_XC_NETWORKING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ..
        shell: cmd

      # 编译（首次编译会通过 vcpkg 自动构建 Qt6 和 Botan，耗时较长）
      - name: Build with Ninja
        run: |
          cd build
          ninja
        shell: cmd

      # 打包
      - name: Package
        run: |
          cd build
          cpack -G ZIP
        shell: cmd

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.zip
