name: Build Release Windows KeePassXC

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Clone and Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      # 显式让 vcpkg 安装 Qt6（根据仓库的 vcpkg.json，通常会自动处理，但有时需要执行一次 install 确保完整）
      - name: Install Dependencies via vcpkg
        run: |
          C:\vcpkg\vcpkg install --triplet x64-windows
        shell: cmd

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DWITH_XC_ALL=ON -DWITH_XC_NETWORKING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ..

      - name: Build with Ninja
        run: |
          cd build
          ninja

      - name: Package
        run: |
          cd build
          cpack -G ZIP

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.zip
