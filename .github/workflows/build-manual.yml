name: Build Windows KeePassXC

on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 使用 GitHub 官方的 setup-cmake 动作，自带 CMake
      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # 使用 scoop 或直接下载 Ninja，或者用静默参数的 winget
      - name: Install Ninja via winget (Silent)
        run: |
          winget install --id Ninja-build.Ninja -e --accept-source-agreements --accept-package-agreements

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DWITH_XC_ALL=ON -DWITH_XC_NETWORKING=OFF -DCMAKE_BUILD_TYPE=Release ..

      - name: Build with Ninja
        run: |
          cd build
          ninja

      - name: Package
        run: |
          cd build
          cpack -G ZIP

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-NoNetwork
          path: build/*.zip
